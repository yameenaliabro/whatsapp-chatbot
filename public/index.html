<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bird Coders — AI Consultant</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        background: #d1d7db;
      }

      nav {
        display: flex;
        gap: 16px;
        font-size: 14px;
      }

      nav a {
        color: #075e54;
        text-decoration: none;
        font-weight: 600;
      }

      nav a:hover {
        text-decoration: underline;
      }

      .chat-window {
        width: 100%;
        max-width: 460px;
        height: 72vh;
        max-height: 720px;
        display: flex;
        flex-direction: column;
        background: #efeae2;
        border-radius: 10px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }

      .chat-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: #008069;
        color: #ffffff;
      }

      .chat-header .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #ffffff33;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      .chat-header .title {
        font-size: 16px;
        font-weight: 600;
      }

      .chat-header .status {
        font-size: 12px;
        opacity: 0.85;
      }

      .chat-messages {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background-image: linear-gradient(rgba(229, 221, 213, 0.6), rgba(229, 221, 213, 0.6));
      }

      .bubble {
        max-width: 80%;
        padding: 7px 10px 8px;
        border-radius: 8px;
        font-size: 14.5px;
        line-height: 1.4;
        color: #111b21;
        white-space: pre-wrap;
        word-wrap: break-word;
        box-shadow: 0 1px 0.5px rgba(0, 0, 0, 0.13);
      }

      .bubble .time {
        display: block;
        margin-top: 2px;
        font-size: 11px;
        color: #667781;
        text-align: right;
      }

      .bubble.sent {
        align-self: flex-end;
        background: #d9fdd3;
        border-top-right-radius: 0;
      }

      .bubble.received {
        align-self: flex-start;
        background: #ffffff;
        border-top-left-radius: 0;
      }

      .bubble.error {
        align-self: center;
        background: #fde0e0;
        color: #8a1f1f;
        font-size: 13px;
        text-align: center;
      }

      .typing {
        align-self: flex-start;
        background: #ffffff;
        border-radius: 8px;
        border-top-left-radius: 0;
        padding: 10px 14px;
        display: flex;
        gap: 4px;
      }

      .typing span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #9aa0a6;
        animation: blink 1.2s infinite both;
      }

      .typing span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes blink {
        0%, 60%, 100% {
          opacity: 0.3;
        }
        30% {
          opacity: 1;
        }
      }

      .chat-input {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: #f0f2f5;
      }

      .chat-input input {
        flex: 1;
        border: none;
        outline: none;
        padding: 11px 14px;
        border-radius: 22px;
        font-size: 15px;
        background: #ffffff;
      }

      .chat-input button {
        width: 46px;
        height: 46px;
        border: none;
        border-radius: 50%;
        background: #008069;
        color: #ffffff;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease;
      }

      .chat-input button:hover {
        background: #017561;
      }

      .chat-input button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/index.html">Chat</a>
      <a href="/lead.html">Lead Form</a>
      <a href="/leads.html">Leads Dashboard</a>
    </nav>

    <div class="chat-window">
      <div class="chat-header">
        <div class="avatar">🐦</div>
        <div>
          <div class="title">Bird Coders — AI Consultant</div>
          <div class="status" id="status">online</div>
        </div>
      </div>

      <div class="chat-messages" id="messages"></div>

      <form class="chat-input" id="chatForm" autocomplete="off">
        <input type="text" id="messageInput" placeholder="Type a message" aria-label="Message" />
        <button type="submit" id="sendButton" aria-label="Send">➤</button>
      </form>
    </div>

    <script>
      const messagesContainer = document.getElementById("messages");
      const chatForm = document.getElementById("chatForm");
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const statusLabel = document.getElementById("status");

      const conversation = [];

      const GREETING = "Hi 👋 I'm Bird Coders' AI Consultant. I'll ask a few quick questions to understand your project. What's your name, and which service are you interested in?";

      function formatCurrentTime() {
        return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }

      function appendBubble(text, variant) {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${variant}`;

        if (variant === "error") {
          bubble.textContent = text;
        } else {
          const content = document.createElement("span");
          content.textContent = text;
          const time = document.createElement("span");
          time.className = "time";
          time.textContent = formatCurrentTime();
          bubble.appendChild(content);
          bubble.appendChild(time);
        }

        messagesContainer.appendChild(bubble);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function showTypingIndicator() {
        const typing = document.createElement("div");
        typing.className = "typing";
        typing.id = "typingIndicator";
        typing.innerHTML = "<span></span><span></span><span></span>";
        messagesContainer.appendChild(typing);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function removeTypingIndicator() {
        const typing = document.getElementById("typingIndicator");
        if (typing) {
          typing.remove();
        }
      }

      function setSendingState(isSending) {
        sendButton.disabled = isSending;
        messageInput.disabled = isSending;
        statusLabel.textContent = isSending ? "typing…" : "online";
      }

      async function requestReply() {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: conversation }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Failed to get a reply.");
        }

        return data.reply;
      }

      async function handleSubmit(event) {
        event.preventDefault();

        const userText = messageInput.value.trim();
        if (!userText) {
          return;
        }

        appendBubble(userText, "sent");
        conversation.push({ role: "user", content: userText });
        messageInput.value = "";

        setSendingState(true);
        showTypingIndicator();

        try {
          const replyText = await requestReply();
          removeTypingIndicator();
          appendBubble(replyText, "received");
          conversation.push({ role: "assistant", content: replyText });
        } catch (error) {
          removeTypingIndicator();
          appendBubble(error.message, "error");
        } finally {
          setSendingState(false);
          messageInput.focus();
        }
      }

      chatForm.addEventListener("submit", handleSubmit);
      appendBubble(GREETING, "received");
      messageInput.focus();
    </script>
  </body>
</html>
